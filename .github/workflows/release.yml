# Push a tag like v0.1.0 and this builds a universal DMG (macOS) and an installer (Windows, see windows.yml)
# and attaches both to a GitHub release.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Optional repository secrets for a Developer ID signed + notarized build (no Gatekeeper warning):
#   MACOS_CERT_P12_BASE64   base64 of your "Developer ID Application" certificate exported as .p12
#   MACOS_CERT_PASSWORD     password of that .p12
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD   for notarization (app-specific password)
# Without them the app is ad-hoc signed (users click "Open Anyway" once, see README).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-15
    env:
      HAS_CERT: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_ID != '' }}
      HAS_STABLE: ${{ secrets.LEVIATHAN_STABLE_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode
        # the runner's default Swift can time out type-checking SwiftUI view bodies
        run: |
          X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$X"
          swiftc --version

      - name: Version
        run: |
          V="${{ github.event.inputs.version }}"
          [ -z "$V" ] && V="${GITHUB_REF_NAME#v}"
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Import Developer ID certificate
        if: env.HAS_CERT == 'true'
        env:
          CERT: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"; KP=$(uuidgen)
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KP" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          ID=$(security find-identity -v -p codesigning "$KC" | awk -F'"' '/Developer ID Application/ { print $2; exit }')
          echo "LEVIATHAN_SIGN_IDENTITY=$ID" >> "$GITHUB_ENV"

      # Without a Developer ID: sign with the project's stable self-signed certificate, so macOS keeps the
      # microphone permission across updates (an ad-hoc signature changes with every release).
      - name: Import stable signing certificate
        if: env.HAS_CERT != 'true' && env.HAS_STABLE == 'true'
        env:
          P12: ${{ secrets.LEVIATHAN_STABLE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.LEVIATHAN_STABLE_P12_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/stable.keychain-db"; KP=$(uuidgen)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/stable.p12"
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          security import "$RUNNER_TEMP/stable.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KP" "$KC"
          rm -f "$RUNNER_TEMP/stable.p12"
          HASH=$(security find-identity -p codesigning "$KC" | awk '/Leviathan Local Signing/ { print $2; exit }')
          [ -n "$HASH" ] || { echo "stable certificate not found in the p12"; exit 1; }
          echo "LEVIATHAN_SIGN_KEYCHAIN=$KC" >> "$GITHUB_ENV"
          echo "LEVIATHAN_SIGN_HASH=$HASH" >> "$GITHUB_ENV"

      - name: Notarization credentials
        if: env.HAS_CERT == 'true' && env.HAS_NOTARY == 'true'
        run: |
          xcrun notarytool store-credentials leviathan --apple-id "${{ secrets.APPLE_ID }}" \
            --team-id "${{ secrets.APPLE_TEAM_ID }}" --password "${{ secrets.APPLE_APP_PASSWORD }}"
          echo "NOTARY_PROFILE=leviathan" >> "$GITHUB_ENV"

      - name: Build DMG
        run: mac/scripts/make_dmg.sh "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: |
            mac/dist/*.dmg
            mac/dist/*.sha256
          if-no-files-found: error

  windows:
    uses: ./.github/workflows/windows.yml
    with:
      version: ${{ github.event.inputs.version || github.ref_name }}

  publish:
    needs: [dmg, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          V="${{ github.event.inputs.version }}"
          [ -z "$V" ] && V="${GITHUB_REF_NAME#v}"
          TAG="v$V"
          ls -la dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "Leviathan - v$V" --generate-notes
          fi
