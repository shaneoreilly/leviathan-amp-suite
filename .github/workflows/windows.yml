# Builds Leviathan for Windows (JUCE, with ASIO) and its installer.
# Runs on pushes that touch windows/, by hand, and from release.yml (which publishes the installer).
name: Windows

on:
  push:
    paths: ["windows/**", ".github/workflows/windows.yml"]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Version
        shell: pwsh
        run: |
          $v = "${{ inputs.version }}"
          if (-not $v) { $v = (Get-Content windows/VERSION -Raw).Trim() }
          $v = $v -replace '^v', ''
          Set-Content -NoNewline windows/VERSION $v
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Steinberg ASIO SDK (dual-licensed; used here under GPLv3). Pinned by checksum, not stored in the repo.
      - name: ASIO SDK
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\asiosdk.zip"
          Invoke-WebRequest -Uri "https://download.steinberg.net/sdk_downloads/ASIO-SDK_2.3.4_2025-10-15.zip" -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "d5ebf0c20dd2c5f43771fd0c1418f4b361bf52434ee670097cfa6b3a335e2eca") { throw "ASIO SDK checksum mismatch: $hash" }
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\asio"
          "ASIO_SDK=$env:RUNNER_TEMP\asio\ASIOSDK" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure
        run: cmake -S windows -B windows/build -A x64 -DLEVIATHAN_ASIO_SDK="$env:ASIO_SDK"
        shell: pwsh

      - name: Build
        run: cmake --build windows/build --config Release --target Leviathan --parallel
        shell: pwsh

      - name: Installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          } else { $iscc = "iscc" }
          & $iscc "/DAppVersion=$env:VERSION" "/DBuildDir=..\build\Leviathan_artefacts\Release" "/DOutDir=..\dist" windows\installer\Leviathan.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          $exe = Get-Item "windows\dist\Leviathan-Setup-$env:VERSION.exe"
          $h = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -NoNewline -Path ($exe.FullName + ".sha256") -Value ($h + "  " + $exe.Name + "`n")
          Get-ChildItem windows\dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            windows/dist/*.exe
            windows/dist/*.sha256
          if-no-files-found: error
